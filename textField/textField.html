<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Braga8 - Sign In</title>
    <link rel="stylesheet" href="textFiledStyle.css">
</head>

<body>

    <div class="container">
        <!-- EMAIL -->
        <div class="text-field">
            <label class="text-field-label">Email</label>
            <input type="email" class="text-field-input" placeholder="your@email.com">
        </div>

        <!-- PASSWORD -->
        <div class="text-field">
            <label class="text-field-label">Password</label>
            <input type="password" class="text-field-input" placeholder="••••••••">
        </div>

        <!-- TEXT BIASA -->
        <div class="text-field">
            <label class="text-field-label">Full Name</label>
            <input type="text" class="text-field-input" placeholder="full name">
        </div>
    </div>

</body>

</html>
