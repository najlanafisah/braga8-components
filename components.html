<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Components</title>
    <link rel="stylesheet" href="componentsStyle.css">
</head>

<body>

    <!-- TITLE -->
    <h1 class="title-text">Sign In to Continue</h1>

    <!-- SUBTITLE -->
    <p class="subtitle-text">Braga8 Utility Billing Management </p>

    <!-- TEXT FIELD -->
    <div class="container">
        <!-- email -->
        <div class="text-field">
            <label class="text-field-label">Email</label>
            <input type="email" class="text-field-input" placeholder="your@email.com">
        </div>

        <!-- password -->
        <div class="text-field">
            <label class="text-field-label">Password</label>
            <input type="password" class="text-field-input" placeholder="••••••••">
        </div>

        <!-- text biasa -->
        <div class="text-field">
            <label class="text-field-label">Full Name</label>
            <input type="text" class="text-field-input" placeholder="full name">
        </div>
    </div>

    <!-- FORGOT & OPTION -->
    <div class="option">
        <label class="remember">
            <input type="checkbox">
            <span>Remember me</span>
        </label>
        <a href="#" class="forgot">Forgot Password?</a>
    </div>

    <!-- GLASS BUTTON -->
    <div>
        <button class="btn-glass">Login</button>
    </div>

</body>

</html>
